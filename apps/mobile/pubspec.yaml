name: advibe_auto_upload
description: Auto-upload photos from ZV-E10 via USB to AdVibe backend
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # File system access
  file_picker: ^12.0.0
  
  # Storage permissions
  permission_handler: ^11.4.0
  
  # USB device detection
  # usb_serial: incompatible con AGP 9 y sin usar en lib/.
  # La carpeta USB se elige con file_picker (photo_uploader.selectUsbFolder).
  # usb_serial: ^0.5.2
  
  # HTTP requests
  http: ^1.1.0
  
  # Local storage for hashes
  shared_preferences: ^2.0.0
  
  # Cryptography for file hashing
  crypto: ^3.0.0
  
  # UUID para idempotencyKey
  uuid: ^4.0.0
  
  # Logging
  logger: ^2.0.0
  
  # State management
  provider: ^6.0.0
  flutter_foreground_task: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
