name: Android APK

on:
  push:
    branches: [feature/auto-upload-dcim]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk AdVibe-Auto-Upload.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AdVibe-Auto-Upload
          path: apps/mobile/AdVibe-Auto-Upload.apk

      # Enlace fijo para bajarlo directo al celular:
      # https://github.com/pablowebster94-sudo/advibe-eventos/releases/download/app-latest/AdVibe-Auto-Upload.apk
      - name: Publish release app-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest AdVibe-Auto-Upload.apk \
            --target "${{ github.sha }}" \
            --title "AdVibe Auto Upload (ultima version)" \
            --notes "APK para el Samsung. Commit ${{ github.sha }}."
